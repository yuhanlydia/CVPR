name: candidate-engineering
on:
  push:
    branches: ["main", "review/wan-readiness-20261006"]
  pull_request:
    paths:
      - "experiments/embedding_heads/**"
      - "tools/*candidate*.py"
      - "tools/run_method.py"
      - "configs/candidates.json"
      - "tests/test_candidate*.py"
      - ".github/workflows/candidate-checks.yml"
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - run: python -m pip install numpy==2.2.6
      - name: Compile candidate code
        run: python -m compileall -q experiments/embedding_heads tools/run_candidates.py tools/prepare_candidate_bundle.py tools/run_method.py tools/collect_candidates.py tools/plan_candidate_carryover.py tests/test_candidate_math.py tests/test_candidate_queue.py tests/test_candidate_carryover.py
      - name: Algebra and queue contracts (not benchmark qualification)
        run: python -m unittest discover -s tests -p 'test_candidate*.py' -v
      - name: CLI entrypoints
        run: |
          python tools/run_candidates.py --help
          python tools/prepare_candidate_bundle.py --help
          python tools/run_method.py --help
          python tools/collect_candidates.py --help
          python tools/plan_candidate_carryover.py --help
